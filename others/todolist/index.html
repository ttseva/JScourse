<!doctype html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
		  name="viewport">
	<meta content="ie=edge" http-equiv="X-UA-Compatible">
	<title>ToDo</title>

	<link href="css/normalize.css" rel="stylesheet" type="text/css">
	<link href="css/style.css" rel="stylesheet" type="text/css">
	<script defer src="js/script.js"></script>
</head>

<body>

	<header class="header">
		<form class="todo-control">
			<label><input class="header-input" placeholder="Какие планы?" type="text"></label>
			<button class="header-button" id="add" type="submit"></button>
		</form>
	</header>

	<div class="todo-container">

		<ul class="todo todo-list" id="todo">

		</ul>
		<ul class="todo todo-completed" id="completed">

		</ul>
	</div>


</body>

</html>
